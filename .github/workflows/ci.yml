name: CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   workflow_dispatch:

jobs:
   unit-tests:
      name: Unit Tests
      runs-on: ubuntu-latest

      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_USER: postgres
               POSTGRES_PASSWORD: postgres
               POSTGRES_DB: folio_test
            ports:
               - 5432:5432
            options: >-
               --health-cmd pg_isready
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5

      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: 'npm'

         - name: Install dependencies
           run: npm ci

         - name: Run migrations
           run: npm run db:migrate
           working-directory: server
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test

         - name: Run Vitest
           run: npm run test:unit
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test
              BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              BETTER_AUTH_URL: http://localhost:3000
              RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
              CLIENT_URL: http://localhost:5173
              CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
              CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
              CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

   e2e-tests:
      name: End-to-End Tests
      runs-on: ubuntu-latest
      needs: unit-tests

      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_USER: postgres
               POSTGRES_PASSWORD: postgres
               POSTGRES_DB: folio_test
            ports:
               - 5432:5432
            options: >-
               --health-cmd pg_isready
               --health-interval 10s
               --health-timeout 5s
               --health-retries 5

      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: 'npm'

         - name: Install dependencies
           run: npm ci

         - name: Run migrations
           run: npm run db:migrate
           working-directory: server
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test

         - name: Install Playwright browsers
           run: npx playwright install --with-deps

         - name: Start server
           run: npm run dev -w server &
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test
              BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              BETTER_AUTH_URL: http://localhost:3000
              RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
              CLIENT_URL: http://localhost:5173
              CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
              CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
              CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

         - name: Wait for server
           run: npx wait-on http://localhost:3000/api/health

         - name: Start client
           run: npm run dev -w client &

         - name: Wait for client
           run: npx wait-on http://localhost:5173

         - name: Run E2E tests
           run: npm run test:e2e
           env:
              DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test
              BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              BETTER_AUTH_URL: http://localhost:3000
              RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
              CLIENT_URL: http://localhost:5173
              CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
              CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
              CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
              VITE_API_URL: http://localhost:3000
              VITE_CLIENT_URL: http://localhost:5173
              CI: true

         - name: Upload test artifacts
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: playwright-results
              path: test-results/
